data:
- name: "'X see Y' frame"
  sentence: "{word_nom} {cl}àŋú {word_acc}"
  description: >
    Two nouns, the noun in question should have a distinct accusative form.
- name: "Intransitive verb"
  sentence: "{subject} {cl}{verb} {adverb}"
  description: >
    A single noun with an intransitive verb.
    Intended to test verbs of different TAM values.
    Adverb can be inserted to add redundancy given TAM value.
  example: >
    A. àpɾí jàbr̀t̪ᴐ́ "The boy jumped"
    B. àpɾí jábə̀rtà "The boy will jump" (canonical form would be "àpɾí já ábr̀t̪à")
    X. àpɾí jábə̀rtò "The boy jumped" (X is misspelled, A is canonical form)

    Note that LevenshteinDistance(jàbr̀t̪ᴐ́, jábə̀rtò) = 5
    and LevenshteinDistance(jábə̀rtà, jábə̀rtò) = 1
    So using Levenshtein Edit Distance as a proxy would incorrectly predict B=X.
- name: "Transitive verb"
  sentence: "{subject} {cl}{verb} {object} {adverb}"
  description: >
    Transitive sentence with subject and object nouns.
    Intended to test verbs of different TAM values.
    Adverb can be inserted to add redundancy given TAM value.