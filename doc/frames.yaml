# Frames for building ABX sentence sets.
# Each frame describes the logic for constructing a set of ABX sentences.
#
# - The `set_type` attribute specifies which subset of the seed word lexicon
#   is relevant for the given frame.
# - Multiple frames may exist for a particular word set. The difference between
#   the logic of each frame is specified in the name and description.
# - The sentence templates attribute apecifies how these sentences AB and X
#   are constructed.
# - When a single generic sentence template is specified, the sentences for
#   AB and X are generated with words subject to constraints for the target word.
# - Regardless of frame constraints, for all sets Levenshtein(A,X) > Levenshtein(B,X).
data:
- name: "tam_alternation_same_object"
  set_type: "tam_alternation"
  sentence_templates:
    generic: "{noun.1} {class}{$tgt} {noun.2}"
  constraints:
    "$tgt":
    - "ab_not_equal"
    - "ax_equal"
    "noun.1":
    - "abx_equal"
    - "role:subject"
    "class":
    - "match:noun.1"
    "noun.2":
    - "abx_equal"
    - "role:object"
  description: >
    Word A and B have different TAM values, and the object noun is same across
    sentences A, B and X.
- name: "tam_alternation_different_object"
  set_type: "tam_alternation"
  sentence_templates:
    generic: "{noun.1} {class}{$tgt} {noun.2}"
  constraints:
    "$tgt":
    - "ab_not_equal"
    - "ax_equal"
    "noun.1":
    - "abx_equal"
    - "role:subject"
    "class":
    - "match:noun.1"
    "noun.2":
    - "bx_equal"
    - "ax_not_equal"
    - "role:object"
  description: >
    Word A and B have different TAM values, and the object noun is the same
    for B and X but different for A.
- name: "tam_alternation_same_object_adverb"
  set_type: "tam_alternation"
  sentence_templates:
    generic: "{noun.1} {class}{$tgt} {noun.2} {adverb}"
  constraints:
    "$tgt":
    - "ab_not_equal"
    - "ax_equal"
    - "ab_aspect_not_equal"
    "noun.1":
    - "abx_equal"
    - "role:subject"
    "class":
    - "match:noun.1"
    "noun.2":
    - "abx_equal"
    - "role:object"
    "adverb":
    - "match:aspect"
  description: >
    Word A and B have different TAM values, and the object noun is same across
    sentences A, B and X. The aspect is corroborated by the presence of a temporal
    adverb.
- name: "tam_alternation_different_object_adverb"
  set_type: "tam_alternation"
  sentence_templates:
    generic: "{noun.1} {class}{$tgt} {noun.2} {adverb}"
  constraints:
    "$tgt":
    - "ab_not_equal"
    - "ax_equal"
    - "ab_aspect_not_equal"
    "noun.1":
    - "abx_equal"
    - "role:subject"
    "class":
    - "match:noun.1"
    "noun.2":
    - "bx_equal"
    - "ax_not_equal"
    - "role:object"
    "adverb":
    - "match:aspect"
  description: >
    Word A and B have different TAM values, and the object noun is the same
    for B and X but different for A. The aspect is corroborated by the presence
    of a temporal adverb.
- name: "noun_verb_alternation"
  set_type: "noun_verb_alternation"
  sentence_templates:
    a: "{$tgt} nɛ̀ {noun}"
    b: "{$tgt} {noun}"
    x: "{$tgt} {class}{adjective}"
  constraints:
    "noun":
    - "ab_equal"
    - "role:invariant"
    "$tgt":
    - "ax_noun"
    - "b_verb"
    "class":
    - "match:$tgt"
  description: >
    Words A and X are a noun that is near-homophonous with a verb, word B.
- name: "nomacc_alternation_same_first_noun"
  set_type: "nomacc_alternation"
  sentence_templates:
    generic: "{noun} {class}àŋú {$tgt}"
  constraints:
    "noun":
    - "abx_equal"
    - "role:subject"
    "class":
    - "match:noun"
    "$tgt":
    - "ax_nom"
    - "b_acc"
  description: >
    Words A and X are both the same noun marked for nominative case.
    Word B is the noun for accusative case. The noun preceding the verb
    (either the subject or a topicalized object) is the same for sentences ABX.
- name: "nomacc_alternation_different_first_noun"
  set_type: "nomacc_alternation"
  sentence_templates:
    generic: "{noun} {class}àŋú {$tgt}"
  constraints:
    "noun":
    - "bx_equal"
    - "ax_not_equal"
    - "role:subject"
    "class":
    - "match:noun"
    "$tgt":
    - "ax_nom"
    - "b_acc"
  description: >
    Words A and X are both the same noun marked for nominative case.
    Word B is the noun for accusative case. The noun preceding the verb
    (either the subject or a topicalized object) is the same for sentences
    B and X but different for A and X.